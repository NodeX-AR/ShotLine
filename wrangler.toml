name = "shotline-arena"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "ARENA", class_name = "Arena" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Arena"]

[[d1_databases]]
binding = "DB"
database_name = "shotline-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # wrangler d1 create shotline-db

[observability]
enabled = true

[dev]
ip = "0.0.0.0"
port = 3000

