name = "shotline-arena"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "ARENA", class_name = "Arena" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Arena"]

[observability]
enabled = true
